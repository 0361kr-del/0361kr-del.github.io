name: Deploy future career
on:
  push:
    branches: ['deploy/future-career']
permissions:
  contents: read
concurrency:
  group: future-career-production
  cancel-in-progress: false
jobs:
  deploy:
    if: github.repository_id == '1177991863'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: future-career
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: future-career/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm --prefix functions ci
      - run: npm run build:functions
      - run: python3 ops/test_deploy_setup.py
      - run: npm test
      - run: npm run test:rules
      - uses: google-github-actions/auth@v3
        with:
          project_id: future-career-interview
          workload_identity_provider: projects/16827856751/locations/global/workloadIdentityPools/career-github/providers/github-deploy
          service_account: career-github-deployer@future-career-interview.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
      - run: python3 ops/prepare-ci-env.py
      - run: npm run build
      - name: Deploy existing functions and hosting
        run: npx -y firebase-tools@latest deploy --non-interactive --only functions:future-career:studentApi,functions:future-career:aiPreview,hosting --project future-career-interview
      - name: Verify hosting response
        run: curl --fail --silent --show-error --retry 3 --output /dev/null https://future-career-interview.web.app/
